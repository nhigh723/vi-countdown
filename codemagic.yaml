# Codemagic cloud build: Capacitor iOS -> signed IPA -> TestFlight / App Store Connect.
# One-time setup (Fizby's pipeline already has these — same Codemagic team):
#   1. Team settings > Team integrations > Developer Portal: App Store Connect API key, named "codemagic".
#   2. App > Environment variables: secret CERTIFICATE_PRIVATE_KEY in group "ios_signing_key".
#   2b. App > Environment variables: secret REVENUECAT_PUBLIC_KEY in group
#       "revenuecat" — the RevenueCat project's public iOS API key (appl_…).
#       The repo's src/config.ts holds ONLY the placeholder; the real key is
#       injected at build time by the "Inject RevenueCat public key" step below
#       and is never committed (this repo is public).
#   3. APP_STORE_APPLE_ID below is the app's Apple ID from App Store Connect
#      (App Information page). The Countdown VI app record exists (Apple ID
#      6834272574) and is already filled in.
workflows:
  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing_key
        - revenuecat
      vars:
        BUNDLE_ID: com.nickhigh.vicountdown
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: 6834272574   # Countdown VI (App Store Connect Apple ID)
    scripts:
      - name: Inject RevenueCat public key (CI secret, never committed)
        script: |
          if [ -z "$REVENUECAT_PUBLIC_KEY" ]; then echo "REVENUECAT_PUBLIC_KEY is not set — add it as a secret in the 'revenuecat' environment group (Codemagic app settings)"; exit 1; fi
          sed -i '' "s|^export const REVENUECAT_API_KEY: string = '[^']*';|export const REVENUECAT_API_KEY: string = '$REVENUECAT_PUBLIC_KEY';|" src/config.ts
          grep -q "^export const REVENUECAT_API_KEY: string = 'appl_" src/config.ts || { echo "RevenueCat key injection failed (assignment line not updated)"; exit 1; }
          grep -q "REVENUECAT_API_KEY !== 'REPLACE_WITH_REVENUECAT_PUBLIC_API_KEY'" src/config.ts || { echo "isRevenueCatConfigured() check was altered — aborting"; exit 1; }
          echo "RevenueCat key injected (value masked)"
      - name: Install and build web app
        script: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Automatic code signing (creates cert/profile via API key if missing)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Bump build number (one above the latest TestFlight build, so re-runs never collide)
        script: |
          if [ "$APP_STORE_APPLE_ID" = "0000000000" ]; then echo "Set APP_STORE_APPLE_ID in codemagic.yaml first (App Store Connect > App Information > Apple ID)"; exit 1; fi
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $((LATEST + 1));/g" ios/App/App.xcodeproj/project.pbxproj
          grep -m1 CURRENT_PROJECT_VERSION ios/App/App.xcodeproj/project.pbxproj
      - name: Build IPA
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true   # internal testers get it automatically after Apple processing
        submit_to_app_store: false
